<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3584e4" />
      <stop offset="100%" stop-color="#1c71d8" />
    </linearGradient>
    <linearGradient id="lid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#62a0ea" />
      <stop offset="100%" stop-color="#3584e4" />
    </linearGradient>
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d32d" />
      <stop offset="100%" stop-color="#ff7800" />
    </linearGradient>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Shadow & Main Container Box -->
  <rect x="20" y="32" width="88" height="76" rx="16" fill="url(#bg-grad)" filter="url(#drop-shadow)" />

  <!-- Top Lid / Accent Bar -->
  <path d="M 20 48 Q 20 32 36 32 L 92 32 Q 108 32 108 48 L 108 52 L 20 52 Z" fill="url(#lid-grad)" />

  <!-- Clean / Trash Sweep Emblem -->
  <!-- Box flap lines -->
  <line x1="64" y1="52" x2="64" y2="108" stroke="#ffffff" stroke-width="3" stroke-opacity="0.2" stroke-dasharray="4 4" />

  <!-- Recycled / Uninstaller Sweep Arrow Arc -->
  <circle cx="64" cy="78" r="22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-dasharray="100 35" />
  <polygon points="76,60 84,72 68,70" fill="#ffffff" />

  <!-- Clean Sparkle Stars -->
  <path d="M 88 28 Q 94 28 94 22 Q 94 28 100 28 Q 94 28 94 34 Q 94 28 88 28 Z" fill="url(#spark-grad)" />
  <path d="M 30 24 Q 34 24 34 20 Q 34 24 38 24 Q 34 24 34 28 Q 34 24 30 24 Z" fill="url(#spark-grad)" />
</svg>
